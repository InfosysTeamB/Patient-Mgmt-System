<div class="section-card">
  <h3>Patients Management</h3>

  <div class="success-msg" *ngIf="msg">{{ msg }}</div>

  <!-- Registration Form -->
  <div class="form-panel">
    <h4>Register New Patient</h4>
    <div class="form-row">
      <div class="form-group">
        <label>Patient ID</label>
        <input type="text" [(ngModel)]="newPatient.patient_id" placeholder="e.g., P-001">
      </div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="newPatient.full_name" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Contact</label>
        <input type="text" [(ngModel)]="newPatient.contact_number" placeholder="123-456-7230">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="newPatient.email_address" placeholder="john@example.com">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" [(ngModel)]="newPatient.date_of_birth">
      </div>
      <button class="btn-add" (click)="registerPatient()">Add Patient</button>
    </div>
  </div>

  <!-- List -->
  <input type="text" [(ngModel)]="searchTerm" class="search-input" placeholder="Search patients...">
  <div *ngIf="filteredPatients.length === 0" class="empty-msg">No patients found.</div>
  <table *ngIf="filteredPatients.length > 0" class="info-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Contact</th>
        <th>Email</th>
        <th>DOB</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of filteredPatients">
        <ng-container *ngIf="editingId === p.id; else viewRow">
          <td><input type="text" [(ngModel)]="editForm.patient_id"></td>
          <td><input type="text" [(ngModel)]="editForm.full_name"></td>
          <td><input type="text" [(ngModel)]="editForm.contact_number"></td>
          <td><input type="text" [(ngModel)]="editForm.email_address"></td>
          <td><input type="date" [(ngModel)]="editForm.date_of_birth"></td>
          <td>
            <button class="btn-save-sm" (click)="saveEdit()">Save</button>
            <button class="btn-cancel-sm" (click)="editingId = null">Cancel</button>
          </td>
        </ng-container>
        <ng-template #viewRow>
          <td>{{ p.patient_id }}</td>
          <td>{{ p.full_name }}</td>
          <td>{{ p.contact_number }}</td>
          <td>{{ p.email_address }}</td>
          <td>{{ p.date_of_birth }}</td>
          <td>
            <button class="btn-edit-sm" (click)="startEdit(p)">Edit</button>
            <button class="btn-delete-sm" (click)="deletePatient(p)">Delete</button>
          </td>
        </ng-template>
      </tr>
    </tbody>
  </table>
</div>
