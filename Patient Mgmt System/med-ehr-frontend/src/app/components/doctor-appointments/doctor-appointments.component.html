<div class="section-card">
  <h3>My Appointments</h3>
  <div *ngIf="myAppointments.length === 0" class="empty-msg">No booked appointments.</div>
  <table *ngIf="myAppointments.length > 0" class="info-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Day</th>
        <th>Time</th>
        <th>Patient</th>
        <th>Contact</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of myAppointments">
        <td>{{ a.appointment_date }}</td>
        <td>{{ a.day_of_week }}</td>
        <td>{{ a.start_time }} - {{ a.end_time }}</td>
        <td>{{ getPatientName(a.patient_id) }}</td>
        <td>{{ getPatientContact(a.patient_id) }}</td>
        <td><span class="status-badge booked">{{ a.status }}</span></td>
      </tr>
    </tbody>
  </table>
</div>
