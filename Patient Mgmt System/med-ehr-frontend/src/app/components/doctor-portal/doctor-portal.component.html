<div class="portal-wrapper">
  <header class="top-nav">
    <div class="nav-left">
      <span class="nav-brand">Med-EHR</span>
      <span class="nav-divider"></span>
      <span class="nav-role">Doctor Portal</span>
    </div>
    <div class="nav-right">
      <div class="user-chip">
        <span class="user-avatar">{{ (user?.name || 'D')?.charAt(0) }}</span>
        <span class="user-name">{{ user?.name || 'Doctor' }}</span>
      </div>
      <button class="btn-logout" (click)="logout()">Sign out</button>
    </div>
  </header>

  <div class="portal-body">
    <aside class="sidebar">
      <span class="sidebar-label">Menu</span>
      <a routerLink="/doctor/overview" routerLinkActive="active" class="sidebar-link">
        <span class="link-icon">&#127968;</span> Dashboard
      </a>
      <a routerLink="/doctor/profile" routerLinkActive="active" class="sidebar-link">
        <span class="link-icon">&#128100;</span> My Profile
      </a>
      <a routerLink="/doctor/schedule" routerLinkActive="active" class="sidebar-link">
        <span class="link-icon">&#128197;</span> My Schedule
      </a>
      <a routerLink="/doctor/appointments" routerLinkActive="active" class="sidebar-link">
        <span class="link-icon">&#128221;</span> My Appointments
      </a>
      <a routerLink="/doctor/consultations" routerLinkActive="active" class="sidebar-link">
        <span class="link-icon">&#128203;</span> Consultations
      </a>
      <a routerLink="/doctor/prescriptions" routerLinkActive="active" class="sidebar-link">
        <span class="link-icon">&#128139;</span> Prescriptions
      </a>
    </aside>

    <main class="portal-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
