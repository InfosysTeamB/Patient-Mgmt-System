<div class="section-card">
  <h3>My Profile</h3>

  <app-loading-spinner *ngIf="loading" label="Loading your profile..."></app-loading-spinner>

  <div *ngIf="!loading && !doctorProfile" class="empty-msg">
    Profile not found. Please contact an administrator.
  </div>

  <!-- View Mode -->
  <ng-container *ngIf="!loading && doctorProfile">
    <table class="info-table" *ngIf="!editMode">
      <tr><td><strong>Name:</strong></td><td>Dr. {{ doctorProfile.doctor_name }}</td></tr>
      <tr><td><strong>Doctor ID:</strong></td><td>{{ doctorProfile.doctor_id }}</td></tr>
      <tr><td><strong>Specialization:</strong></td><td>{{ doctorProfile.specialization }}</td></tr>
    </table>

    <div class="action-row" *ngIf="!editMode">
      <button class="btn-edit" (click)="startEdit()">Edit Profile</button>
    </div>
  </ng-container>

  <!-- Edit Mode -->
  <div class="edit-form" *ngIf="editMode">
    <div class="form-group">
      <label>Doctor Name</label>
      <input type="text" [(ngModel)]="editForm.doctor_name" name="doctor_name">
    </div>
    <div class="form-group">
      <label>Specialization</label>
      <input type="text" [(ngModel)]="editForm.specialization" name="specialization">
    </div>
    <div class="action-row">
      <button class="btn-save" (click)="saveEdit()">Save</button>
      <button class="btn-cancel" (click)="cancelEdit()">Cancel</button>
    </div>
  </div>
</div>
