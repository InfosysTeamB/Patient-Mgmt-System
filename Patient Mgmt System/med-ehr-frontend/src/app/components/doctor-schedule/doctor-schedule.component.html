<div class="section-card">
  <h3>My Schedule</h3>

  <!-- Create New Slot -->
  <div class="create-slot-form">
    <h4>Add Availability</h4>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" [(ngModel)]="newSlot.appointment_date">
      </div>
      <div class="form-group">
        <label>Day</label>
        <select [(ngModel)]="newSlot.day_of_week">
          <option value="" disabled>Select</option>
          <option *ngFor="let day of weekDays" [value]="day">{{ day }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Start</label>
        <select [(ngModel)]="newSlot.start_time">
          <option value="" disabled>Select</option>
          <option *ngFor="let t of timeSlots" [value]="t.start">{{ t.label }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>End</label>
        <select [(ngModel)]="newSlot.end_time">
          <option value="" disabled>Select</option>
          <option *ngFor="let t of timeSlots" [value]="t.end">{{ t.label }}</option>
        </select>
      </div>
      <button class="btn-create" (click)="createSlot()">Add Slot</button>
    </div>
  </div>

  <!-- Schedule Grid -->
  <app-loading-spinner *ngIf="loading" label="Loading your schedule..."></app-loading-spinner>
  <ng-container *ngIf="!loading">
    <div class="date-filter">
      <label>Filter by Date:</label>
      <input type="date" [(ngModel)]="selectedDate">
      <button class="btn-clear-filter" (click)="clearFilters()">Clear</button>
    </div>
    <div *ngIf="mySlots.length === 0" class="empty-msg">
      You haven't added any availability yet.
      <div class="empty-cta">Use the form above to add your first time slot.</div>
    </div>
    <table class="grid-table" *ngIf="mySlots.length > 0">
      <thead>
        <tr>
          <th>Time</th>
          <th *ngFor="let day of weekDays">{{ day }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of timeSlots">
          <td>{{ t.label }}</td>
          <td *ngFor="let day of weekDays">
            <ng-container *ngIf="getSlotForTimeAndDay(t.start, day) as slot; else noSlot">
              <div class="slot-cell">
                <span [class]="'slot-badge ' + (slot.status | lowercase)">{{ slot.status }}</span>
                <span class="slot-doctor" *ngIf="slot.status === 'Booked' && getPatientName(slot)">{{ getPatientName(slot) }}</span>
                <button *ngIf="slot.status === 'Available'" class="btn-delete-sm" (click)="deleteSlot(slot)">Delete</button>
              </div>
            </ng-container>
            <ng-template #noSlot><span class="slot-badge unassigned">-</span></ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </ng-container>
</div>
