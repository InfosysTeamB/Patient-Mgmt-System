<div class="section-card">
  <h3>Book an Appointment</h3>

  <app-loading-spinner *ngIf="loading" label="Loading available slots..."></app-loading-spinner>

  <ng-container *ngIf="!loading">
    <div class="date-filter">
      <label>Filter by Date:</label>
      <input type="date" [(ngModel)]="selectedDate">
      <label>Doctor:</label>
      <select [(ngModel)]="selectedDoctor">
        <option value="">All Doctors</option>
        <option *ngFor="let d of doctors" [value]="d.doctor_id">Dr. {{ d.doctor_name }}</option>
      </select>
      <button class="btn-clear-filter" (click)="clearFilters()">Clear</button>
    </div>

    <table class="grid-table">
      <thead>
        <tr>
          <th>Time</th>
          <th *ngFor="let day of weekDays">{{ day }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of timeSlots">
          <td>{{ t.label }}</td>
          <td *ngFor="let day of weekDays">
            <ng-container *ngIf="getSlotForTimeAndDay(t.start, day) as slot; else noSlot">
              <button class="slot-cell bookable" [class.disabled]="slot.status !== 'Available'" [disabled]="slot.status !== 'Available'" (click)="bookAppointment(slot)">
                <span [class]="'slot-badge ' + (slot.status | lowercase)">{{ slot.status }}</span>
                <span class="slot-doctor" *ngIf="slot.doctor_id">{{ getDoctorName(slot.doctor_id) }}</span>
              </button>
            </ng-container>
            <ng-template #noSlot><span class="slot-badge unassigned">-</span></ng-template>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="booking-hint">Click an <span class="status-badge available">Available</span> slot above to book it.</div>
  </ng-container>
</div>
