<div class="section-card">
  <h3>Find Doctors</h3>
  <input type="text" [(ngModel)]="searchTerm" class="search-input" placeholder="Search by name or specialization...">
  <app-loading-spinner *ngIf="loading" label="Loading doctors..."></app-loading-spinner>
  <div *ngIf="!loading && filteredDoctors.length === 0" class="empty-msg">No doctors found.</div>
  <table *ngIf="!loading && filteredDoctors.length > 0" class="info-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Specialization</th>
        <th>Doctor ID</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of filteredDoctors">
        <td>Dr. {{ d.doctor_name }}</td>
        <td>{{ d.specialization }}</td>
        <td>{{ d.doctor_id }}</td>
        <td><a routerLink="/patient/book" class="btn-book">Book</a></td>
      </tr>
    </tbody>
  </table>
</div>
