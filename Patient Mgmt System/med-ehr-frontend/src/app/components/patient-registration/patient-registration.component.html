<div class="portal-container">
    <h2 class="centered-title">Med-EHR Portal: Patient Records & Scheduling</h2>

    <h3 class="centered-subtitle">Patient Registration</h3>

    <form (ngSubmit)="registerPatient()" class="registration-form">
        <table class="styled-table">
            <tr>
                <td><label>Patient ID:</label></td>
                <td><input type="text" [(ngModel)]="newPatient.patient_id" name="patient_id" placeholder="e.g., P-001"
                        required></td>
            </tr>
            <tr>
                <td><label>Full Name:</label></td>
                <td><input type="text" [(ngModel)]="newPatient.full_name" name="full_name" placeholder="John Doe"
                        required></td>
            </tr>
            <tr>
                <td><label>Contact Number:</label></td>
                <td><input type="text" [(ngModel)]="newPatient.contact_number" name="contact_number"
                        placeholder="123-456-7230" required></td>
            </tr>
            <tr>
                <td><label>Email Address:</label></td>
                <td><input type="email" [(ngModel)]="newPatient.email_address" name="email_address"
                        placeholder="johndoe@gmail.com" required></td>
            </tr>
            <tr>
                <td><label>Date of Birth:</label></td>
                <td><input type="date" [(ngModel)]="newPatient.date_of_birth" name="date_of_birth" required></td>
            </tr>
            <tr>
                <td><label>Gender:</label></td>
                <td>
                    <select [(ngModel)]="newPatient.gender" name="gender">
                        <option value="">Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label>Blood Group:</label></td>
                <td>
                    <select [(ngModel)]="newPatient.blood_group" name="blood_group">
                        <option value="">Select blood group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="Unknown">Unknown</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label>Address:</label></td>
                <td><input type="text" [(ngModel)]="newPatient.address" name="address" placeholder="Street, city, state"></td>
            </tr>
            <tr>
                <td><label>Emergency Contact Name:</label></td>
                <td><input type="text" [(ngModel)]="newPatient.emergency_contact_name" name="emergency_contact_name" placeholder="Jane Doe"></td>
            </tr>
            <tr>
                <td><label>Emergency Contact Number:</label></td>
                <td><input type="text" [(ngModel)]="newPatient.emergency_contact_number" name="emergency_contact_number" placeholder="123-456-7890"></td>
            </tr>
        </table>
        <button type="submit" class="btn-submit">Register Patient</button>
    </form>

    <h3 class="section-heading">Registered Patients List</h3>
    <ul class="patient-list">
        <li *ngFor="let p of patients">
            <strong>{{ p.full_name }}</strong> (ID: {{ p.patient_id }}) - {{ p.contact_number }} - {{ p.email_address }}
        </li>
    </ul>
</div>
